# sandore 静态组合（patch overlay）：插件加载仅经此静态组合，启动即生效。
#
# 顶层为 YAML list；`- insert:` 块内每一行 `- id: <rowId> + name: '<包名>'`
# 即插入一个插件行（静态组合挂载），可再带 `config`。格式对齐 DSH
# `examples/web-cordis/cordis.yml` 的 patch overlay。
#
# 只挂插件行：microflow / tool 是 workflow 的依赖库（被 workflow import），
# 不是插件，不能作为独立行挂载（会报 invalid plugin）。
#
# 行 id 统一加 `sandore-` 前缀：DSH bundle 的行 id 都是语义前缀（ui-* / tool-* /
# storage-* / workflow-worker-thread 等），裸 `workflow` / `ui` 过于通用，容易与
# 后续新增行或其它 overlay 的 id patch 冲突。
#
# storage 路由也固化在这里：无论在哪台机器、哪个 profile，只要启动带上本
# overlay，sandore 存储域就路由到 sqlite（行级读写，避免 json 后端把整个
# unit 全量重写进 sandore.json 导致膨胀）。`- id: storage-domain` 的 patch
# 会整行替换该行 config，所以必须同时带 `backend: json`（DSH bundle 默认）。

- insert:
    - id: sandore-workflow
      name: "@deepseek-ai/dsh-sandore-workflow"
      config:
        defaultTimeoutMs: 7200000
        maxConcurrentSteps: 0
    - id: sandore-ui
      name: "@deepseek-ai/dsh-client-ui-sandore"
    - id: storage-sqlite
      name: "@deepseek-ai/dsh-storage-sqlite"
      config:
        path: !!js dshHomePath('storages/sandore.sqlite')

# sandore 持久化走 sqlite：把 sandore 存储域路由到 sqlite 后端，
# 其余域保持 json 默认不变。
- id: storage-domain
  config:
    backend: json
    routes:
      sandore: sqlite
