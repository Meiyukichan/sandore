# sandore 本地开发 overlay（--patch 方式）
#
# 本地测试/开发用：`dsh web --patch D:\project-code\llm\sandore\cordis.yml --port 3090`。
# 顶层为 YAML list；`- insert:` 块内每一行 `- id: <rowId> + name: '<包名>'`
# 即插入一个插件行（静态组合挂载），可再带 `config`。
#
# 插件行 name = 本包名（'dsh-sandore'）：host 半由 main 提供；client 半经
# package.json 的 `dsh.client` 声明被 client-modules 扫描发现（exports["./client"]）。
#
# storage 路由也固化在这里：sandore 存储域路由到 sqlite（行级读写，避免 json 后端
# 把整个 unit 全量重写进 sandore.json 导致膨胀）。`- id: storage-domain` 的 patch
# 会整行替换该行 config，所以必须同时带 `backend: json`（DSH bundle 默认）。
# storage-sqlite 包随本包 dependencies 安装（^0.1.0-rc.6），profile 可直接解析。
#
# 发布形态走 bundle 通道（`dsh plugin --profile web add dsh-sandore` 自动 merge
# `cordis.patch.yml`），本地开发保持本 overlay，避免双挂载。

- insert:
    - id: sandore
      name: 'dsh-sandore'
      config:
        defaultTimeoutMs: 7200000
        maxConcurrentSteps: 0
    - id: storage-sqlite
      name: '@deepseek-ai/dsh-storage-sqlite'
      config:
        path: !!js dshHomePath('storages/sandore.sqlite')

# sandore 持久化走 sqlite：把 sandore 存储域路由到 sqlite 后端，
# 其余域保持 json 默认不变。
- id: storage-domain
  config:
    backend: json
    routes:
      sandore: sqlite
